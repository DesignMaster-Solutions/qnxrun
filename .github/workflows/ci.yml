# Stubs only: docker and QEMU are replaced, the real agent is compiled natively. No SDP, no license.
name: ci
on: [push, pull_request]
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
